name: Package WordPress Plugin

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    # Tag pushes create the release. Human-published releases still get a zip.
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'release' && github.event.release.author.login != 'github-actions[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-dev --prefer-dist --no-interaction

      - name: Create plugin zip
        run: |
          mkdir -p build/mcdonald-web-works-cache-smasher
          tar -cf - \
            --exclude .git \
            --exclude .github \
            --exclude .gitignore \
            --exclude .cursor \
            --exclude build \
            --exclude '*.zip' \
            . | tar -xf - -C build/mcdonald-web-works-cache-smasher
          (
            cd build
            zip -r ../mcdonald-web-works-cache-smasher.zip mcdonald-web-works-cache-smasher
          )
          unzip -l mcdonald-web-works-cache-smasher.zip
          test -f mcdonald-web-works-cache-smasher.zip

      - name: Read release notes
        id: release
        run: |
          title="${GITHUB_REF_NAME#v}"
          echo "title=${title}" >> "$GITHUB_OUTPUT"
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          notes="$(git for-each-ref --format='%(contents)' "refs/tags/${GITHUB_REF_NAME}")"
          {
            echo "body<<EOF"
            printf '%s\n' "$notes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload plugin zip to release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release.outputs.title }}
          body: ${{ steps.release.outputs.body }}
          files: mcdonald-web-works-cache-smasher.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
